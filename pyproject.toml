[project]
name = "tycoon-toy"
version = "0.2.0"
description = "Toy CLI used as a fixture for the PR-size-limit sandbox"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tycoon = "tycoon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tycoon"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
