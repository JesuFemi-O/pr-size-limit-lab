[project]
name = "minicity"
version = "0.1.0"
description = "Toy CLI used as a fixture for the PR-size-limit sandbox"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
minicity = "minicity.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minicity"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
